<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b18">
  <title>Dice | Scai Warrior</title>
  <link rel="stylesheet" href="./game-theme.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.10.0/dist/ethers.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@walletconnect/ethereum-provider@2.11.0/dist/index.umd.js"></script>
  <style>
    .dice-table { position:relative; display:flex; align-items:center; justify-content:center; gap:24px; width:min(390px,90vw); min-height:250px; border:1px solid rgba(46,230,166,.2); border-radius:48%; background:radial-gradient(ellipse,rgba(20,157,125,.28),rgba(4,57,48,.2) 58%,rgba(8,11,24,.4) 60%); box-shadow:inset 0 0 50px rgba(0,0,0,.35); }
    .dice { width:clamp(92px,18vw,132px); filter:drop-shadow(0 18px 18px rgba(0,0,0,.48)); }
    .dice.rolling:first-child{animation:roll-one .5s linear infinite}.dice.rolling:last-child{animation:roll-two .55s linear infinite}
    @keyframes roll-one{50%{transform:translateY(-24px) rotate(190deg)}} @keyframes roll-two{50%{transform:translateY(-18px) rotate(-170deg)}}
    .total-badge{position:absolute;bottom:19px;left:50%;padding:7px 14px;border:1px solid var(--line);border-radius:999px;color:#cbd5e1;background:rgba(15,23,42,.82);font-size:12px;font-weight:800;transform:translateX(-50%)}
  </style>
</head>
<body>
  <main class="game-shell">
    <header class="game-topbar"><a class="back-link" href="./index.html">← Game lobby</a><div class="brand">SCAI<span>WARRIOR</span></div><div class="network-chip">Sepolia testnet</div></header>
    <section class="game-card">
      <div class="game-heading"><div class="eyebrow">Two-dice challenge</div><h1>Roll the Dice</h1><p>Predict whether the total will be under seven, exactly seven, or over seven.</p></div>
      <div class="game-grid">
        <div class="visual-panel"><div class="dice-table"><img id="dice1" class="dice" src="./assets/dice1.png" alt="First die"><img id="dice2" class="dice" src="./assets/dice1.png" alt="Second die"><div id="total" class="total-badge">TOTAL —</div></div></div>
        <aside class="control-panel">
          <h2>Make your prediction</h2>
          <div class="choice-grid three"><button class="choice-button selected" data-choice="0">Under 7<br>2×</button><button class="choice-button" data-choice="1">Exactly 7<br>5×</button><button class="choice-button" data-choice="2">Over 7<br>2×</button></div>
          <label class="field-label" for="bet">Stake amount</label>
          <div class="bet-wrap"><input id="bet" type="number" min="0.05" max="1" step="0.01" placeholder="0.05"><span>ETH</span></div>
          <div class="presets"><button class="preset" data-bet="0.05">0.05</button><button class="preset" data-bet="0.1">0.10</button><button class="preset" data-bet="0.25">0.25</button><button class="preset" data-bet="0.5">0.50</button></div>
          <div id="betInfo" class="bet-summary">Under/Over pays 2×. Exactly seven pays 5×.</div>
          <button id="rollBtn" class="primary-button">Roll the dice</button>
          <div id="result" class="status-box">Ready when you are.</div>
        </aside>
      </div>
    </section>
  </main>
  <script type="module">
    import { connectWallet, playDice } from "./game.js";
    const dice1=document.getElementById("dice1"),dice2=document.getElementById("dice2"),betInput=document.getElementById("bet"),betInfo=document.getElementById("betInfo"),resultBox=document.getElementById("result"),rollBtn=document.getElementById("rollBtn"),total=document.getElementById("total");
    let choice=0,rollingTimer,isPlaying=false;
    window.Telegram?.WebApp?.ready();window.Telegram?.WebApp?.expand();connectWallet();
    const setStatus=(message,tone="")=>{resultBox.className=`status-box ${tone}`.trim();resultBox.textContent=message;};
    function updateBet(){const bet=Number(betInput.value),multi=choice===1?5:2;betInfo.innerHTML=bet?`Stake <strong>${bet.toFixed(4)} ETH</strong><br>Winning payout: ${(bet*multi).toFixed(4)} ETH`:"Under/Over pays 2×. Exactly seven pays 5×.";}
    document.querySelectorAll(".preset").forEach(button=>button.addEventListener("click",()=>{betInput.value=button.dataset.bet;updateBet();}));betInput.addEventListener("input",updateBet);
    document.querySelectorAll("[data-choice]").forEach(button=>button.addEventListener("click",()=>{choice=Number(button.dataset.choice);document.querySelectorAll("[data-choice]").forEach(item=>item.classList.remove("selected"));button.classList.add("selected");updateBet();}));
    function startRolling(){dice1.classList.add("rolling");dice2.classList.add("rolling");rollingTimer=setInterval(()=>{dice1.src=`./assets/dice${Math.floor(Math.random()*6)+1}.png`;dice2.src=`./assets/dice${Math.floor(Math.random()*6)+1}.png`;},90);}
    function stopRolling(){clearInterval(rollingTimer);dice1.classList.remove("rolling");dice2.classList.remove("rolling");}
    rollBtn.addEventListener("click",async()=>{if(isPlaying)return;const bet=Number(betInput.value);if(bet<.05||bet>1){setStatus("Enter a bet between 0.05 and 1 ETH.","danger");return;}isPlaying=true;rollBtn.disabled=true;betInput.disabled=true;total.textContent="ROLLING";startRolling();setStatus("Confirm in your wallet. Rolling while the transaction settles…");try{const outcome=await playDice(choice,bet);stopRolling();dice1.src=`./assets/dice${outcome.d1}.png`;dice2.src=`./assets/dice${outcome.d2}.png`;total.textContent=`TOTAL ${outcome.total}`;if(outcome.win)setStatus(`Total ${outcome.total}. You won ${(bet*(choice===1?5:2)).toFixed(4)} ETH!`,"success");else setStatus(`Total ${outcome.total}. You lost ${bet.toFixed(4)} ETH.`,"danger");}catch(error){console.error(error);stopRolling();total.textContent="TOTAL —";setStatus(error.shortMessage||error.message||"Transaction was not completed.","danger");}finally{isPlaying=false;rollBtn.disabled=false;betInput.disabled=false;}});
  </script>
</body>
</html>
